openapi: 3.0.3
info:
  title: Spotify Metadata API
  version: v1
  description: |
    OpenAPI reference generated from live container tests and handlers.
servers:
  - url: http://localhost:8080
tags:
  - name: Root
  - name: Health
  - name: Tracks
  - name: Albums
  - name: Artists
  - name: Playlists
  - name: Proxy
paths:
  /:
    get:
      tags: [Root]
      summary: Root discovery
      responses:
        "200":
          description: API metadata and route list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootResponse"
              examples:
                default:
                  value:
                    name: spotify-query-api
                    version: v1
                    routes:
                      - GET /v1/health
                      - GET /v1/tracks/search
                      - GET /v1/tracks/{id}
                      - GET /v1/albums/search
                      - GET /v1/albums/{id}
                      - GET /v1/artists/search
                      - GET /v1/artists/{id}
                      - GET /v1/playlists/{id}
                      - ANY /v1/spotify/*
                      - ANY /v1/trackfiles/*
  /v1:
    get:
      tags: [Root]
      summary: Root discovery (versioned)
      responses:
        "200":
          description: API metadata and route list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootResponse"
  /v1/health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Database reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/tracks/search:
    get:
      tags: [Tracks]
      summary: Search tracks
      parameters:
        - name: query
          in: query
          description: Track name substring.
          schema:
            type: string
        - name: artist
          in: query
          description: Artist name substring.
          schema:
            type: string
        - name: album
          in: query
          description: Album name substring.
          schema:
            type: string
        - name: genre
          in: query
          description: Artist genre substring.
          schema:
            type: string
        - name: sort
          in: query
          description: Sort order.
          schema:
            type: string
            enum: [popularity, name, release_date, recent]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Track search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackSearchResponse"
              examples:
                empty:
                  value:
                    paging:
                      limit: 1
                      offset: 0
                    data: null
        "500":
          description: Query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/tracks/{id}:
    get:
      tags: [Tracks]
      summary: Track detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Track detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackDetail"
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/albums/search:
    get:
      tags: [Albums]
      summary: Search albums
      parameters:
        - name: query
          in: query
          description: Album name substring.
          schema:
            type: string
        - name: artist
          in: query
          description: Artist name substring.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Album search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumSearchResponse"
              examples:
                empty:
                  value:
                    paging:
                      limit: 1
                      offset: 0
                    data: null
        "500":
          description: Query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/albums/{id}:
    get:
      tags: [Albums]
      summary: Album detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Album detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumDetail"
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Album not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/artists/search:
    get:
      tags: [Artists]
      summary: Search artists
      parameters:
        - name: query
          in: query
          description: Artist name substring.
          schema:
            type: string
        - name: genre
          in: query
          description: Genre substring.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Artist search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistSearchResponse"
              examples:
                empty:
                  value:
                    paging:
                      limit: 1
                      offset: 0
                    data: null
        "500":
          description: Query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/artists/{id}:
    get:
      tags: [Artists]
      summary: Artist detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artist detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistDetail"
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Artist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/playlists/{id}:
    get:
      tags: [Playlists]
      summary: Playlist detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Playlist detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistDetail"
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Playlist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/spotify/{proxyPath}:
    get:
      tags: [Proxy]
      summary: Proxy to Spotify upstream
      description: |
        Proxies requests to the configured Spotify upstream. All HTTP methods are supported.
      parameters:
        - name: proxyPath
          in: path
          required: true
          description: Greedy path to proxy (may include slashes).
          schema:
            type: string
      responses:
        "200":
          description: Upstream response (passthrough)
        default:
          description: Upstream error response (passthrough)
  /v1/trackfiles/{proxyPath}:
    get:
      tags: [Proxy]
      summary: Proxy to trackfile upstream
      description: |
        Proxies requests to the configured trackfile upstream. All HTTP methods are supported.
      parameters:
        - name: proxyPath
          in: path
          required: true
          description: Greedy path to proxy (may include slashes).
          schema:
            type: string
      responses:
        "200":
          description: Upstream response (passthrough)
        "503":
          description: Trackfile upstream not configured
        default:
          description: Upstream error response (passthrough)
components:
  parameters:
    Limit:
      name: limit
      in: query
      description: Max results (1-100). Default 25.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Offset:
      name: offset
      in: query
      description: Offset into results. Default 0.
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    RootResponse:
      type: object
      required: [name, version, routes]
      properties:
        name:
          type: string
        version:
          type: string
        routes:
          type: array
          items:
            type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Paging:
      type: object
      required: [limit, offset]
      properties:
        limit:
          type: integer
        offset:
          type: integer
    TrackSearchResponse:
      type: object
      required: [paging, data]
      properties:
        paging:
          $ref: "#/components/schemas/Paging"
        data:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/TrackSummary"
    AlbumSearchResponse:
      type: object
      required: [paging, data]
      properties:
        paging:
          $ref: "#/components/schemas/Paging"
        data:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/AlbumSummary"
    ArtistSearchResponse:
      type: object
      required: [paging, data]
      properties:
        paging:
          $ref: "#/components/schemas/Paging"
        data:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ArtistSummary"
    TrackSummary:
      type: object
      required: [id, name, popularity, duration_ms, explicit]
      properties:
        id:
          type: string
        name:
          type: string
        popularity:
          type: integer
        duration_ms:
          type: integer
        explicit:
          type: boolean
        preview_url:
          type: string
          nullable: true
        album:
          $ref: "#/components/schemas/AlbumSummary"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ArtistSummary"
        external_isrc:
          type: string
          nullable: true
    TrackDetail:
      type: object
      required: [track, album, artists]
      properties:
        track:
          $ref: "#/components/schemas/TrackSummary"
        album:
          $ref: "#/components/schemas/AlbumDetail"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ArtistDetail"
        track_file:
          $ref: "#/components/schemas/TrackFileDetail"
        fetched_at:
          type: string
          nullable: true
    TrackFileDetail:
      type: object
      required: [status]
      properties:
        status:
          type: string
        filename:
          type: string
          nullable: true
        filesize_bytes:
          type: integer
          format: int64
          nullable: true
        sha256_original:
          type: string
          nullable: true
        reencoded_kbit_vbr:
          type: integer
          format: int64
          nullable: true
        fetched_at:
          type: string
          nullable: true
        session_country:
          type: string
          nullable: true
        content_ratings:
          type: string
          nullable: true
        file_id_ogg_vorbis_96:
          type: string
          nullable: true
        file_id_ogg_vorbis_160:
          type: string
          nullable: true
        file_id_ogg_vorbis_320:
          type: string
          nullable: true
        file_id_aac_24:
          type: string
          nullable: true
        file_id_mp3_96:
          type: string
          nullable: true
        alternatives:
          type: array
          items:
            type: string
          nullable: true
    AlbumSummary:
      type: object
      required: [id, name, album_type, release_date, total_tracks, popularity]
      properties:
        id:
          type: string
        name:
          type: string
        album_type:
          type: string
        release_date:
          type: string
        total_tracks:
          type: integer
        popularity:
          type: integer
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
    AlbumDetail:
      allOf:
        - $ref: "#/components/schemas/AlbumSummary"
        - type: object
          required: [label, release_date_precision]
          properties:
            label:
              type: string
            release_date_precision:
              type: string
            external_upc:
              type: string
              nullable: true
            copyright_c:
              type: string
              nullable: true
            copyright_p:
              type: string
              nullable: true
            tracks:
              type: array
              items:
                $ref: "#/components/schemas/TrackSummary"
            artists:
              type: array
              items:
                $ref: "#/components/schemas/ArtistSummary"
    ArtistSummary:
      type: object
      required: [id, name, popularity, followers_total]
      properties:
        id:
          type: string
        name:
          type: string
        popularity:
          type: integer
        followers_total:
          type: integer
        genres:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
    ArtistDetail:
      allOf:
        - $ref: "#/components/schemas/ArtistSummary"
        - type: object
          properties:
            albums:
              type: array
              items:
                $ref: "#/components/schemas/ArtistAlbumSummary"
    ArtistAlbumSummary:
      allOf:
        - $ref: "#/components/schemas/AlbumSummary"
        - type: object
          required: [is_appears_on, is_implicit_appears_on]
          properties:
            is_appears_on:
              type: boolean
            is_implicit_appears_on:
              type: boolean
            index_in_album:
              type: integer
              nullable: true
    PlaylistDetail:
      type: object
      required: [id, snapshot_id, name, tracks_total]
      properties:
        id:
          type: string
        snapshot_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        owner_id:
          type: string
          nullable: true
        owner_display_name:
          type: string
          nullable: true
        followers_total:
          type: integer
          nullable: true
        tracks_total:
          type: integer
        fetched_at:
          type: string
          nullable: true
        images:
          type: array
          items:
            $ref: "#/components/schemas/PlaylistImage"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/PlaylistTrack"
    PlaylistImage:
      type: object
      required: [url]
      properties:
        url:
          type: string
    PlaylistTrack:
      type: object
      required: [position, is_episode, is_local]
      properties:
        position:
          type: integer
        added_at:
          type: string
          nullable: true
        added_by_id:
          type: string
          nullable: true
        is_episode:
          type: boolean
        is_local:
          type: boolean
        track:
          $ref: "#/components/schemas/TrackSummary"
        local_track:
          $ref: "#/components/schemas/LocalTrack"
    LocalTrack:
      type: object
      properties:
        name:
          type: string
          nullable: true
        uri:
          type: string
          nullable: true
        album_name:
          type: string
          nullable: true
        artists_name:
          type: string
          nullable: true
        duration_ms:
          type: integer
          nullable: true
    Image:
      type: object
      required: [width, height, url]
      properties:
        width:
          type: integer
        height:
          type: integer
        url:
          type: string
